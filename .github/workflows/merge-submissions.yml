name: Merge lexicon submissions

# Runs when an approved submission PR lands on main (or by hand from the
# Actions tab). Folds submissions/*.json into the data files and removes them.
on:
  push:
    branches: [main]
    paths: ["submissions/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: merge-submissions
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge submissions into data files
        run: python scripts/merge_submissions.py

      - name: Commit and push
        run: |
          git config user.name "lexicon-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A lexicon.json parallel_sentences.jsonl submissions
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Merge approved lexicon submissions"
          git pull --rebase origin main
          git push origin HEAD:main
